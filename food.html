<!DOCTYPE html>
<html>
<head>
    <title>My Restaurant Menu Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #ff4500;
        }
        /*sibling selector - styles and paragraphs right after h1*/
        h1 + p {
        background-color: #ffe4e1;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        /*child selector - styles for paragraphs inside a div with class "menu"*/
        .menu p {
            list-style-type: none;
            font-size: 18px;
            font-weight: bold;
            color: #ff6347;
            padding: 8px;
            margin: 5px 0;
            width: 300px;
            background -color: #fff0f5;
            border-radius: 4px;
        }
        /*nth-child selector - styles for every 3 paragraph inside the menu div*/
        .menu p:nth-child(3n) {
            background-color: #ffe4e1;
        }
        /*nth-highlight the third item as chef's special*/
        .menu p:nth-child(3) {
            background-color: #ffb6c1;
        }
.description {
            color: #555;
            margin-top: 20px;
            font-size: 16px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
