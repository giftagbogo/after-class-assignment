<!DOCTYPE html>
<html>
<head>
  <title>My animal fact file</title>
</head>
<style>
    */ page background -sets the color and font for the whole web page */
    body{
        background-color: darkgreen;
        font-family: Arial, Helvetica, sans-serif;
    }
    /*box model-width sets the content area 
    padding pushes the text away from the edges
    boarder draws a visible frame around the fact file
    margin pushes the fact file away from the edges of the page*/
    .fact-file{
        background-color: lightyellow;
        color: darkslategray;
        width: 260px;
        padding: 25px;
        border: 5px solid forestgreen;
        margin: 30px auto;
    }
    /*Animal name - forestgreen so it stands out*/
    .animal-name{
        color: forestgreen;
        font-size: 22px;
    }
    /*details rows -dark text on light background for easy reading*/
    .details-row{
        background-color: lightgreen;
        color: darkslategray;
        padding: 5px;
    }
</style>
<p class="animal-name">snow</p>
